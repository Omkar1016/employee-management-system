version: "3.9"
services:
 backend:
   build: ./backend
   container_name: fastapi_backend
   ports:
     - "8000:8000"
   depends_on:
     - db
   restart: always
 db:
   image: mysql:8
   container_name: mysql_db
   restart: always
   environment:
     MYSQL_ROOT_PASSWORD: root
     MYSQL_DATABASE: employee_db
   ports:
     - "3306:3306"
   volumes:
     - mysql_data:/var/lib/mysql
volumes:
 mysql_data: